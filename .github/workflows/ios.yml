name: iOS build and protocol checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release policy
        run: python3 -m unittest discover -s test -p release_policy_test.py
      - name: Validate release candidate or promotion
        id: release_version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_policy.py "$RELEASE_TAG" --output "$GITHUB_OUTPUT" --verify-candidate --platform ios --workflow 'iOS build and protocol checks'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install latest stable CMake
        run: ./scripts/setup-cmake-ci.sh
      - name: Install CocoaPods 1.17.0
        run: |
          gem install cocoapods -v 1.17.0 --user-install --no-document
          echo "$(ruby -r rubygems -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - name: Flutter tests and failure diagnostics
        shell: bash
        run: |
          set +e
          flutter test test/ios_room_creation_test.dart --reporter expanded > "$RUNNER_TEMP/dawnmesh-flutter-test.log" 2>&1
          dawnmesh_test_status=$?
          if [ "$dawnmesh_test_status" -eq 0 ]; then
            flutter test --concurrency=1 --reporter expanded >> "$RUNNER_TEMP/dawnmesh-flutter-test.log" 2>&1
            dawnmesh_test_status=$?
          fi
          cat "$RUNNER_TEMP/dawnmesh-flutter-test.log"
          if [ "$dawnmesh_test_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/dawnmesh-flutter-test.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          failed = [i for i, line in enumerate(lines) if '[E]' in line]
          context = []
          for i in failed[:2]:
              context.extend(line[:400] for line in lines[max(0, i - 2):i + 20])
          message = '\n'.join(context + lines[-12:])[:12000]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Flutter test failures::' + message)
          PYTHON
          fi
          exit "$dawnmesh_test_status"
      - run: ./scripts/check-native.sh
      - name: Build iOS and expose compiler diagnostics
        shell: bash
        run: |
          set +e
          (set -e; ./scripts/build-ios.sh; ./scripts/build-ios.sh --wifi-aware) > "$RUNNER_TEMP/dawnmesh-ios-build.log" 2>&1
          dawnmesh_build_status=$?
          cat "$RUNNER_TEMP/dawnmesh-ios-build.log"
          if [ "$dawnmesh_build_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/dawnmesh-ios-build.log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [line[:400] for line in lines if any(word in line.lower() for word in ['error', 'failed', 'duplicate', 'unable', 'exception', '[!]'])]
          message = '\n'.join((errors[:8] + errors[-4:] + [line[:200] for line in lines[-8:]]))[:3800]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=iOS build diagnostics::' + message)
          PYTHON
          fi
          exit "$dawnmesh_build_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DawnMeshIOS-unsigned-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
      - name: Package unsigned app for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          name="${version%%+*}"
          build="${version##*+}"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist)" == "$name" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist)" == "$build" ]]
          mkdir -p dist
          archive="DawnMeshIOS-${name}-unsigned.app.zip"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          aware="DawnMeshIOS-${name}-wifi-aware-unsigned.app.zip"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos-aware/Runner.app "dist/$aware"
          (cd dist && shasum -a 256 "$aware" > "$aware.sha256")
      - name: Upload tagged release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DawnMeshIOS-release-package
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and publish unsigned release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DawnMeshIOS-release-package --dir dist
          prerelease=false
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=true
          base="${RELEASE_TAG%%-*}"
          notes="docs/RELEASE_${base#v}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$prerelease" == true ]] || { echo 'Stable release already exists; leave published assets unchanged' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease --latest=false
          else
            flags=(--verify-tag --title "DawnMesh iOS ${RELEASE_TAG#v}")
            [[ -f "$notes" ]] && flags+=(--notes-file "$notes") || flags+=(--generate-notes)
            [[ "$prerelease" == true ]] && flags+=(--prerelease --latest=false)
            gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
          fi
